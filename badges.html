<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Значки ачівок</title>
  <style>
    body { margin: 0; padding: 16px; background: #17212b; color: #f5f5f5; font: 14px/1.4 system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    table { border-collapse: collapse; }
    th { font-weight: 400; color: #8aa; padding: 4px 8px; text-align: left; }
    td { padding: 4px 8px; }
    svg { display: block; width: 64px; height: 64px; }
    .locked svg { filter: grayscale(.75) brightness(.75); }
  </style>
</head>
<body>
  <h1>Значки ачівок: усі символи × матеріали</h1>
  <table id="grid"></table>
  <script src="badges.js"></script>
  <script>
    // Сторінка для перевірки стилю: кожен символ у кожному матеріалі, ранг 3, остання колонка — неотримана
    const tiers = ["bronze", "silver", "gold", "mythic", "stone"];
    const grid = document.getElementById("grid");
    grid.innerHTML = `<tr><th></th>${tiers.map((t) => `<th>${t}</th>`).join("")}<th>locked</th></tr>` +
      Object.keys(GLYPHS).map((g) => `<tr><th>${g}</th>${tiers.map((t) => `<td>${badgeSvg({ glyph: g, tier: t, rank: 3 })}</td>`).join("")}` +
        `<td class="locked">${badgeSvg({ glyph: g, tier: "gold", rank: 3 })}</td></tr>`).join("");
  </script>
</body>
</html>
